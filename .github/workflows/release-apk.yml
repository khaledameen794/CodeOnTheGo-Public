name: Build signed Release APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch can be requested for another ref, but this release build
    # intentionally runs only from the protected main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Gradle reads this during configuration; release assets are staged from
      # their public HTTPS URLs below, so the legacy SCP task is not invoked.
      SCP_HOST: unused

    steps:
      - name: Check out main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install reproducible Android toolchain
        uses: flox/install-flox-action@v2

      - name: Create Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            # Keep CI builds possible when the optional production Firebase
            # config is not configured; this placeholder is not a production key.
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "codeonthego-ci",
              "storage_bucket": "codeonthego-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.itsaky.androidide" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "CI_PLACEHOLDER_NOT_FOR_PRODUCTION" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Download and verify full Release assets
        run: |
          set -euo pipefail
          base='https://appdevforall.org/dev-assets/release'
          while IFS='|' read -r remote relative; do
            [[ -n "$remote" ]] || continue
            target="assets/release/$relative"
            url="$base/$remote"
            mkdir -p "$(dirname "$target")"
            echo "Downloading $remote"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              "$url" -o "$target"
            expected=$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
              "$url.md5" | tr -d '[:space:]')
            if [[ ! "$expected" =~ ^[[:xdigit:]]{32}$ ]]; then
              echo "Invalid MD5 checksum response for $remote" >&2
              exit 1
            fi
            printf '%s  %s\n' "$expected" "$target" | md5sum --check --status
            echo "Verified $relative"
          done <<'ASSETS'
          gradle-8.14.3-bin.zip.br|common/data/common/gradle-8.14.3-bin.zip.br
          gradle-api-8.14.3.jar.br|common/data/common/gradle-api-8.14.3.jar.br
          localMvnRepository.zip.br|common/data/common/localMvnRepository.zip.br
          documentation.db.br|common/database/documentation.db.br
          v7/android-sdk.zip.br|v7/data/common/android-sdk.zip.br
          v7/bootstrap.zip.br|v7/data/common/bootstrap.zip.br
          v8/android-sdk.zip.br|v8/data/common/android-sdk.zip.br
          v8/bootstrap.zip.br|v8/data/common/bootstrap.zip.br
          core.cgt.br|common/data/common/core.cgt.br
          ASSETS

      - name: Verify signing secrets and keystore
        env:
          IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}
          IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
          IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
          IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
        run: |
          set -euo pipefail
          for name in IDE_SIGNING_KEY_BIN IDE_SIGNING_ALIAS IDE_SIGNING_STORE_PASS IDE_SIGNING_KEY_PASS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository signing secret $name is not set"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/signing-key.jks"
          printf '%s' "$IDE_SIGNING_KEY_BIN" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          test -s "$key_path"
          keytool -list -keystore "$key_path" \
            -storepass "$IDE_SIGNING_STORE_PASS" \
            -alias "$IDE_SIGNING_ALIAS" >/dev/null
          keytool -certreq -keystore "$key_path" \
            -storepass "$IDE_SIGNING_STORE_PASS" \
            -keypass "$IDE_SIGNING_KEY_PASS" \
            -alias "$IDE_SIGNING_ALIAS" \
            -file "$RUNNER_TEMP/signing-key-check.csr" >/dev/null
          rm -f "$RUNNER_TEMP/signing-key-check.csr"
          echo 'Release keystore and private-key credentials are valid.'

      - name: Assemble ARM64 and ARM32 Release APKs
        env:
          IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}
          IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
          IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
          IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
        run: |
          set -euo pipefail
          free -h
          nproc
          gradle_args=(
            --no-daemon --console=plain --max-workers=1 --stacktrace
            -Dorg.gradle.jvmargs='-Xmx10g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            -Dorg.gradle.parallel=false
            -Dorg.gradle.configureondemand=false
            -Pkotlin.daemon.jvm.options=-Xmx1024m
            -Pkotlin.compiler.execution.strategy=in-process
            -Pkapt.incremental.apt=false
            -Pandroid.aapt2.daemonHeapSize=512M
          )
          # Each flavor has a shared recompressApk finalizer that receives its
          # ABI via task-local extra properties. Separate invocations prevent
          # the two flavors from racing to configure that shared finalizer.
          flox activate -d flox/base -- ./gradlew \
            :app:assembleV8Release "${gradle_args[@]}"
          flox activate -d flox/base -- ./gradlew \
            :app:assembleV7Release "${gradle_args[@]}"

      - name: Verify APKs, signatures, and bundled assets
        env:
          IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}
          IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
          IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
          IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
        run: |
          set -euo pipefail
          mapfile -t arm64_apks < <(find app/build/outputs/apk -type f -path '*/v8/release/*.apk' -print | sort)
          mapfile -t arm32_apks < <(find app/build/outputs/apk -type f -path '*/v7/release/*.apk' -print | sort)
          [[ ${#arm64_apks[@]} -eq 1 ]] || { echo "Expected one ARM64 Release APK, found ${#arm64_apks[@]}" >&2; exit 1; }
          [[ ${#arm32_apks[@]} -eq 1 ]] || { echo "Expected one ARM32 Release APK, found ${#arm32_apks[@]}" >&2; exit 1; }

          mkdir -p dist
          cp "${arm64_apks[0]}" dist/CodeOnTheGo-arm64-v8a-release.apk
          cp "${arm32_apks[0]}" dist/CodeOnTheGo-armeabi-v7a-release.apk

          key_path="$RUNNER_TEMP/signing-key.jks"
          printf '%s' "$IDE_SIGNING_KEY_BIN" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          expected_cert=$(keytool -exportcert -keystore "$key_path" \
            -storepass "$IDE_SIGNING_STORE_PASS" -alias "$IDE_SIGNING_ALIAS" \
            | openssl dgst -sha256 | awk '{print tolower($NF)}')
          test -n "$expected_cert"

          for apk in dist/*.apk; do
            echo "Verifying $(basename "$apk")"
            signature_output=$(flox activate -d flox/base -- apksigner verify --verbose --print-certs "$apk")
            actual_cert=$(printf '%s\n' "$signature_output" \
              | awk '/Signer #1 certificate SHA-256 digest:/ {print tolower($NF); exit}')
            if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
              echo "APK certificate does not match the configured release keystore: $apk" >&2
              exit 1
            fi
            entries=$(unzip -Z1 "$apk")
            for asset in \
              assets/data/common/gradle-8.14.3-bin.zip.br \
              assets/data/common/gradle-api-8.14.3.jar.br \
              assets/data/common/localMvnRepository.zip.br \
              assets/database/documentation.db.br \
              assets/data/common/android-sdk.zip.br \
              assets/data/common/bootstrap.zip.br \
              assets/data/common/core.cgt.br; do
              if ! grep -Fxq "$asset" <<<"$entries"; then
                echo "Required Release asset missing from $apk: $asset" >&2
                exit 1
              fi
            done
            echo "APK signature and required assets verified: $(du -h "$apk" | cut -f1)"
          done

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload verified Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: CodeOnTheGo-Release-APKs-${{ github.sha }}
          path: |
            dist/CodeOnTheGo-arm64-v8a-release.apk
            dist/CodeOnTheGo-armeabi-v7a-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing and service configuration files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing-key.jks" \
            "$RUNNER_TEMP/signing-key-check.csr" \
            app/google-services.json \
            build/signing/signing-key.jks
